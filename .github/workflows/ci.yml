name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            src
            tests

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install ruff==0.15.9

      - name: Ruff format
        run: python -m ruff format --check --diff .

      - name: Ruff lint
        run: python -m ruff check --output-format=full .

  python-checks:
    name: ty + Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            src
            tests

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install Python dependencies
        run: uv sync --python "${{ matrix.python-version }}" --extra dev --locked

      - name: ty static type checks
        run: uv run --no-sync ty check

      - name: Pytest tests
        run: uv run --no-sync python -m pytest

  package:
    name: Package Build + clean wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Install and smoke test the wheel in a clean environment
        run: |
          uv venv --python python /tmp/package-smoke
          uv pip install --python /tmp/package-smoke/bin/python dist/*.whl
          /tmp/package-smoke/bin/python -c "import mypackage; print(mypackage.do_useful_thing())"
